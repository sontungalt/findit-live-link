<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FindIt is live on the web.">
    <title>FindIt</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080b12;
        color: #f5f7ff;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-block-size: 100svh;
        place-items: center;
        margin: 0;
        background: radial-gradient(circle at 20% 15%, #204c6d, transparent 38%), #080b12;
      }

      main {
        inline-size: min(42rem, calc(100% - 2rem));
        padding: clamp(2rem, 7vw, 4.5rem);
        border: 1px solid #31516b;
        border-radius: 1.5rem;
        background: rgb(11 18 29 / 84%);
        box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #8ed8ff;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 6rem);
        letter-spacing: -0.075em;
      }

      p {
        max-inline-size: 34rem;
        color: #c9d6e5;
        font-size: clamp(1.1rem, 2.5vw, 1.35rem);
        line-height: 1.55;
      }

      .status {
        display: inline-flex;
        gap: 0.55rem;
        align-items: center;
        margin-block-start: 1.2rem;
        padding: 0.6rem 0.9rem;
        border-radius: 999px;
        background: #123b32;
        color: #a6f3d5;
        font-weight: 650;
      }

      .status::before {
        inline-size: 0.65rem;
        block-size: 0.65rem;
        border-radius: 50%;
        background: #5aefb9;
        content: "";
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">FindIt</p>
      <h1>FindIt</h1>
      <p>This link is live. Keep it handy—more is on the way.</p>
      <span class="status">Live</span>
    </main>
  </body>
</html>
