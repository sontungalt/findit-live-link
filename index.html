<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="FindIt: a simple school lost-and-found app.">
    <meta name="theme-color" content="#f2f2f7">
    <title>FindIt</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1c1e; background: #f2f2f7; }
      * { box-sizing: border-box; }
      body { min-block-size: 100svh; margin: 0; background: #f2f2f7; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .app-shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-block-size: 100svh; max-inline-size: 56rem; margin: 0 auto; background: #f2f2f7; box-shadow: 0 0 2rem rgb(0 0 0 / 8%); }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-block-size: 3.75rem; padding: 0.75rem 1rem; border-bottom: 1px solid #d1d1d6; background: rgb(255 255 255 / 92%); backdrop-filter: blur(12px); }
      .brand { color: #007aff; font-size: 1.25rem; font-weight: 750; letter-spacing: -0.03em; }
      .tagline { color: #636366; font-size: 0.875rem; }
      #screen { overflow: auto; padding: 1.15rem 1rem 1.5rem; }
      .screen-title-row, .toolbar, .item-card__header, .item-card__meta, .empty-state { display: flex; align-items: center; }
      .screen-title-row { justify-content: space-between; gap: 1rem; margin-block-end: 1rem; }
      h1 { margin: 0; font-size: clamp(1.65rem, 5vw, 2.1rem); letter-spacing: -0.045em; }
      h2 { margin: 0; font-size: 1.15rem; letter-spacing: -0.025em; }
      .button, .icon-button, .chip { border: 0; border-radius: 0.7rem; font-weight: 650; }
      .button { padding: 0.7rem 0.95rem; background: #007aff; color: white; }
      .button:hover { background: #006fe6; }
      .button:disabled { cursor: not-allowed; opacity: 0.45; }
      .button--secondary { border: 1px solid #c7c7cc; background: white; color: #007aff; }
      .button--danger { background: #ff3b30; }
      .icon-button { padding: 0.5rem 0.65rem; background: transparent; color: #007aff; }
      .category-scroller { display: flex; gap: 0.65rem; overflow-x: auto; margin: 0 -1rem 1rem; padding: 0 1rem 0.25rem; scrollbar-width: none; }
      .chip { flex: 0 0 auto; padding: 0.55rem 0.9rem; border: 1px solid #c7c7cc; background: white; color: #636366; }
      .chip[aria-pressed="true"] { border-color: #007aff; background: #007aff; color: white; }
      .list { display: grid; gap: 0.7rem; }
      .item-card { inline-size: 100%; padding: 0.9rem 1rem; border: 1px solid #e2e2e7; border-radius: 0.85rem; background: white; color: inherit; text-align: left; }
      button.item-card:hover { border-color: #a8a8b0; }
      .item-card__header { justify-content: space-between; gap: 1rem; }
      .item-card__title { font-size: 1rem; font-weight: 700; }
      .item-card__description { margin: 0.35rem 0 0; color: #636366; line-height: 1.4; }
      .item-card__meta { flex-wrap: wrap; gap: 0.35rem 0.55rem; margin-top: 0.65rem; color: #636366; font-size: 0.8rem; }
      .meta-dot::before { margin-right: 0.55rem; color: #c7c7cc; content: "•"; }
      .item-card__actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.7rem; }
      .empty-state { flex-direction: column; justify-content: center; gap: 0.45rem; min-block-size: 15rem; border: 1px dashed #c7c7cc; border-radius: 1rem; color: #636366; text-align: center; }
      .empty-state strong { color: #1c1c1e; }
      .settings-copy { color: #636366; }
      .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #d1d1d6; background: rgb(255 255 255 / 94%); backdrop-filter: blur(12px); }
      .tab { display: grid; place-items: center; gap: 0.16rem; min-block-size: 4rem; padding: 0.4rem; border: 0; background: transparent; color: #8e8e93; font-size: 0.72rem; }
      .tab__icon { font-size: 1.22rem; line-height: 1; }
      .tab[aria-selected="true"] { color: #007aff; font-weight: 700; }
      dialog { inline-size: min(34rem, calc(100% - 2rem)); max-block-size: calc(100svh - 2rem); padding: 0; border: 0; border-radius: 1rem; box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 28%); }
      dialog::backdrop { background: rgb(0 0 0 / 38%); }
      .dialog__header, .dialog__footer { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 1.1rem; }
      .dialog__header { border-bottom: 1px solid #e5e5ea; }
      form { margin: 0; }
      .form-fields { display: grid; gap: 1rem; padding: 1.1rem; }
      label { display: grid; gap: 0.4rem; color: #3a3a3c; font-size: 0.875rem; font-weight: 650; }
      input, select, textarea { inline-size: 100%; padding: 0.7rem 0.75rem; border: 1px solid #c7c7cc; border-radius: 0.65rem; background: #fff; color: #1c1c1e; }
      textarea { min-block-size: 6.75rem; resize: vertical; }
      @media (min-width: 46rem) { body { padding: 1.5rem; } .app-shell { min-block-size: calc(100svh - 3rem); border: 1px solid #d1d1d6; border-radius: 1.25rem; overflow: hidden; } }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar"><span class="brand">FindIt</span><span class="tagline">Lost &amp; Found</span></header>
      <main id="screen" tabindex="-1"></main>
      <nav class="tabbar" aria-label="FindIt sections">
        <button class="tab" type="button" data-tab="browse" aria-selected="true"><span class="tab__icon" aria-hidden="true">⌕</span>Browse</button>
        <button class="tab" type="button" data-tab="post" aria-selected="false"><span class="tab__icon" aria-hidden="true">⊕</span>Post</button>
        <button class="tab" type="button" data-tab="my-stuff" aria-selected="false"><span class="tab__icon" aria-hidden="true">▣</span>My stuff</button>
        <button class="tab" type="button" data-tab="settings" aria-selected="false"><span class="tab__icon" aria-hidden="true">⚙</span>Settings</button>
      </nav>
    </div>
    <dialog id="post-dialog" aria-labelledby="post-dialog-title">
      <form id="post-form" method="dialog">
        <div class="dialog__header"><button class="icon-button" id="cancel-post" type="button">Cancel</button><h2 id="post-dialog-title">New Found Item</h2><button class="button" id="save-post" type="submit">Save</button></div>
        <div class="form-fields">
          <label>Title <input name="title" required autocomplete="off"></label>
          <label>Category <select name="category"></select></label>
          <label>Where it was found <input name="foundLocation" autocomplete="off"></label>
          <label>Date found <input name="foundDate" type="date" required></label>
          <label>Description <textarea name="description"></textarea></label>
        </div>
      </form>
    </dialog>
    <script type="module" src="app.js"></script>
  </body>
</html>
